name: Morning brief

on:
  schedule:
    # Wake up every 15 minutes; the gate job decides whether it's time to prepare
    # (07:00) or send (07:30) in the phone's current time zone (BRIEF_TIMEZONE,
    # kept up to date by the app). Most wake-ups skip in a few seconds.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Prepare and send a brief right now"
        type: boolean
        default: true
      test_notification:
        description: "Only send a test notification (no brief)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: morning-brief
  cancel-in-progress: false

env:
  BRIEF_TIMEZONE: ${{ vars.BRIEF_TIMEZONE }}
  BRIEF_SEND_AT: ${{ vars.BRIEF_SEND_AT }}
  BRIEF_ENGINE: ${{ vars.BRIEF_ENGINE }}
  BRIEF_MODEL: ${{ vars.BRIEF_MODEL }}
  BRIEF_EFFORT: ${{ vars.BRIEF_EFFORT }}
  BRIEF_WEB_RESEARCH: ${{ vars.BRIEF_WEB_RESEARCH }}
  INVESTOR_PROFILE: ${{ vars.INVESTOR_PROFILE }}
  VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
  VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
  NTFY_SERVER: ${{ vars.NTFY_SERVER }}
  WEB_PUSH_SUBSCRIPTIONS: ${{ secrets.WEB_PUSH_SUBSCRIPTIONS }}
  VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
  NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      action: ${{ steps.plan.outputs.action }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            brief
            data/state.json
          sparse-checkout-cone-mode: false

      - name: Decide what to do
        id: plan
        run: |
          if [ "${{ inputs.test_notification }}" = "true" ]; then
            echo "action=test" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.force }}" = "true" ]; then
            python3 -m brief gate --force
          else
            python3 -m brief gate
          fi

  generate:
    needs: gate
    if: needs.gate.outputs.action == 'generate'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Free: Claude Code signed in with your Claude subscription (`claude setup-token`).
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Alternative, billed per token: an Anthropic API key.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Claude Code
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: npm install -g @anthropic-ai/claude-code@2

      - name: Generate brief
        id: gen
        run: python -m brief generate

      - name: Save brief to the repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          if [ "${{ steps.gen.outcome }}" = "success" ]; then
            git commit -m "Brief for $(jq -r .date data/latest.json)"
          else
            git commit -m "Record failed brief attempt"
          fi
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Build site
        run: python -m brief build-site --out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [gate, deploy]
    if: >-
      always() && (needs.gate.outputs.action == 'notify' || needs.gate.outputs.action == 'test'
      || needs.deploy.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}  # includes the brief committed by the generate job

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send notification (at 07:30 local, or now if forced)
        run: |
          export SITE_URL="${SITE_URL:-https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/}"
          if [ "${{ needs.gate.outputs.action }}" = "test" ]; then
            python -m brief notify --test
          elif [ "${{ inputs.force }}" = "true" ]; then
            python -m brief notify --force
          else
            python -m brief notify
          fi

      - name: Record that today's brief was sent
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet && exit 0
          git commit -m "Sent brief for $(jq -r .last_notified_date data/state.json)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
